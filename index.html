<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Twitch Watch</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root{
    --stage:#120A18;
    --panel:#1E1424;
    --panel-line:#332545;
    --ink:#F2EDF7;
    --muted:#8C7FA0;
    --signal:#9B5DE5;
    --live:#FF5A36;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--stage);
    color:var(--ink);
    font-family:'IBM Plex Sans', system-ui, sans-serif;
    display:flex;
    flex-direction:column;
    min-height:100vh;
    overflow:hidden;
  }

  /* ---------- top bar ---------- */
  header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:14px 20px;
    border-bottom:1px solid var(--panel-line);
    flex-shrink:0;
  }
  .brand{
    font-family:'Big Shoulders Display', system-ui, sans-serif;
    font-weight:700;
    font-size:22px;
    letter-spacing:0.02em;
    display:flex;
    align-items:baseline;
    gap:8px;
  }
  .brand span{color:var(--signal);}
  .status{
    display:flex;
    align-items:center;
    gap:16px;
    font-size:13px;
    color:var(--muted);
  }
  .live-pill{
    display:flex;
    align-items:center;
    gap:6px;
    color:var(--live);
    font-weight:600;
  }
  .live-dot{
    width:8px;height:8px;border-radius:50%;
    background:var(--live);
    animation:pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse{
    0%,100%{opacity:1; transform:scale(1);}
    50%{opacity:0.45; transform:scale(0.8);}
  }
  #participants{color:var(--muted);}

  /* ---------- stage ---------- */
  main{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    min-height:0;
  }
  .stage-frame{
    width:100%;
    height:100%;
    max-width:1400px;
    background:#000;
    border:1px solid var(--panel-line);
    position:relative;
    overflow:hidden;
  }
  .stage-frame iframe{
    width:100%;
    height:100%;
    border:0;
    display:block;
  }
  .empty-state{
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:10px;
    text-align:center;
    padding:24px;
  }
  .empty-state h1{
    font-family:'Big Shoulders Display', system-ui, sans-serif;
    font-weight:700;
    font-size:clamp(24px, 4vw, 40px);
    margin:0;
    color:var(--ink);
  }
  .empty-state p{
    margin:0;
    color:var(--muted);
    font-size:14px;
    max-width:360px;
    line-height:1.5;
  }

  /* ---------- control strip ---------- */
  footer{
    display:flex;
    align-items:center;
    gap:10px;
    padding:14px 20px;
    background:var(--panel);
    border-top:1px solid var(--panel-line);
    flex-shrink:0;
  }
  footer label{
    font-size:12px;
    color:var(--muted);
    white-space:nowrap;
  }
  footer input{
    flex:1;
    max-width:280px;
    background:transparent;
    border:1px solid var(--panel-line);
    color:var(--ink);
    font-family:'IBM Plex Sans', system-ui, sans-serif;
    font-size:14px;
    padding:9px 12px;
    outline:none;
  }
  footer input:focus{
    border-color:var(--signal);
  }
  footer input::placeholder{color:var(--muted);}
  footer button{
    background:var(--signal);
    color:#0E0813;
    border:none;
    font-family:'IBM Plex Sans', system-ui, sans-serif;
    font-weight:600;
    font-size:14px;
    padding:9px 18px;
    cursor:pointer;
  }
  footer button:hover{filter:brightness(1.1);}
  footer button:active{filter:brightness(0.95);}
  .hint{
    font-size:12px;
    color:var(--muted);
    margin-left:auto;
    display:none;
  }
  @media (min-width:640px){ .hint{ display:block; } }
</style>
</head>
<body>

  <header>
    <div class="brand">Twitch<span>Watch</span></div>
    <div class="status">
      <span id="participants"></span>
      <span class="live-pill" id="live-pill" style="display:none;">
        <span class="live-dot"></span>AO VIVO
      </span>
    </div>
  </header>

  <main>
    <div class="stage-frame" id="stage-frame">
      <div class="empty-state" id="empty-state">
        <h1>Nenhuma transmissão selecionada</h1>
        <p>Digite o nome do canal da Twitch abaixo e combine com o grupo quem vocês vão assistir.</p>
      </div>
    </div>
  </main>

  <footer>
    <label for="channel-input">Canal</label>
    <input id="channel-input" type="text" placeholder="ex: chockytv" autocomplete="off" />
    <button id="watch-btn">Assistir</button>
    <span class="hint">Todos precisam digitar o mesmo canal para assistir juntos</span>
  </footer>

<script type="module">
  // ---------------------------------------------------------------
  // Twitch Watch — Discord Activity
  // ---------------------------------------------------------------
  // 1. Troque DISCORD_CLIENT_ID pelo Client ID do seu app criado em
  //    https://discord.com/developers/applications
  // 2. Hospede este arquivo (index.html) no GitHub Pages.
  // 3. No Discord Developer Portal, em "Activities" > "URL Mappings",
  //    aponte a raiz "/" para o domínio do GitHub Pages (sem https://
  //    e sem barra final, ex: seunome.github.io/twitch-watch).
  // ---------------------------------------------------------------
  const DISCORD_CLIENT_ID = "1545950295488598056";

  const els = {
    stage: document.getElementById("stage-frame"),
    empty: document.getElementById("empty-state"),
    input: document.getElementById("channel-input"),
    button: document.getElementById("watch-btn"),
    live: document.getElementById("live-pill"),
    participants: document.getElementById("participants"),
  };

  let insideDiscord = false;
  let discordSdk = null;

  // Tenta inicializar o SDK do Discord. Se o app não estiver rodando
  // dentro do Discord (ex: você testando o link do GitHub Pages direto
  // no navegador), o app continua funcionando normalmente sozinho.
  try {
    const { DiscordSDK } = await import(
      "https://cdn.jsdelivr.net/npm/@discord/embedded-app-sdk/+esm"
    );
    discordSdk = new DiscordSDK(DISCORD_CLIENT_ID);
    await discordSdk.ready();
    insideDiscord = true;

    // Mostra quantas pessoas estão na atividade, quando disponível.
    // Isso não exige OAuth — apenas o handshake feito por ready().
    try {
      const { participants } = await discordSdk.commands.getInstanceConnectedParticipants();
      if (participants?.length) {
        els.participants.textContent =
          participants.length === 1
            ? "1 pessoa na sala"
            : `${participants.length} pessoas na sala`;
      }
    } catch (_) {
      // Endpoint indisponível nesta versão do SDK ou fora de um servidor — segue sem contador.
    }
  } catch (err) {
    console.warn("Rodando fora do Discord (ou SDK não carregou):", err);
  }

  // Domínio que a Twitch precisa reconhecer como "parent". Dentro do
  // Discord, a atividade roda atrás de um proxy em algo como
  // "<client_id>.discordsays.com" — o hostname atual já reflete isso.
  function twitchParents() {
    const hosts = new Set([window.location.hostname]);
    hosts.add("localhost"); // conveniência para testes locais
    return [...hosts].filter(Boolean);
  }

  function loadChannel(channel) {
    const clean = channel.trim().replace(/^https?:\/\/(www\.)?twitch\.tv\//i, "").split("/")[0];
    if (!clean) return;

    const parentParams = twitchParents()
      .map((h) => `parent=${encodeURIComponent(h)}`)
      .join("&");
    const src = `https://player.twitch.tv/?channel=${encodeURIComponent(clean)}&${parentParams}&muted=false`;

    els.stage.innerHTML = `<iframe
        src="${src}"
        allowfullscreen
        allow="autoplay; fullscreen"
      ></iframe>`;
    els.live.style.display = "flex";

    const url = new URL(window.location.href);
    url.searchParams.set("canal", clean);
    window.history.replaceState({}, "", url);
    els.input.value = clean;
  }

  els.button.addEventListener("click", () => loadChannel(els.input.value));
  els.input.addEventListener("keydown", (e) => {
    if (e.key === "Enter") loadChannel(els.input.value);
  });

  // Se alguém compartilhar o link com ?canal=xxxx já preenchido
  // (por exemplo colando no chat de voz), a atividade abre direto nele.
  const preset = new URL(window.location.href).searchParams.get("canal");
  if (preset) loadChannel(preset);
</script>
</body>
</html>
